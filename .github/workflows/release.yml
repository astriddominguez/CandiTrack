name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Abre/actualiza el PR de release y, al fusionarlo, crea el tag y la GitHub Release.
      # Usa un token propio para que la CI se ejecute en el PR de release
      # (los PRs creados con GITHUB_TOKEN no disparan otros workflows).
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

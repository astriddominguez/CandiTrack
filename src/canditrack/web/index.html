<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CandiTrack</title>
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/style.css" />
    <!-- Chart.js va antes: app.js lo usa. Ambos se ejecutan en orden al terminar de cargar la página. -->
    <script src="/static/vendor/chart.js-4.4.1/chart.umd.js" defer></script>
    <script type="module" src="/static/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <h1>CandiTrack</h1>
      <label class="period">
        Periodo
        <select id="period">
          <option value="7d">Últimos 7 días</option>
          <option value="30d">Últimos 30 días</option>
          <option value="60d" selected>Últimos 60 días</option>
          <option value="90d">Últimos 90 días</option>
          <option value="1y">Último año</option>
        </select>
      </label>
    </header>

    <main>
      <p id="error" class="error" role="alert" hidden></p>

      <section class="kpis" aria-label="Cifras del periodo">
        <article class="kpi">
          <h2>Enviadas</h2>
          <p class="kpi-value" id="kpi-sent">…</p>
          <p class="kpi-note" id="kpi-sent-note"></p>
        </article>
        <article class="kpi">
          <h2>Con respuesta</h2>
          <p class="kpi-value" id="kpi-responded">…</p>
          <p class="kpi-note">vistas o rechazadas por la empresa</p>
        </article>
        <article class="kpi">
          <h2>Sin respuesta</h2>
          <p class="kpi-value" id="kpi-no-response">…</p>
          <p class="kpi-note" id="kpi-no-response-note"></p>
        </article>
        <article class="kpi">
          <h2>Días hasta respuesta</h2>
          <p class="kpi-value" id="kpi-days">…</p>
          <p class="kpi-note">mediana desde el envío</p>
        </article>
      </section>

      <section class="panel" aria-labelledby="chart-title">
        <h2 id="chart-title">Por plataforma</h2>
        <div class="chart-box">
          <canvas
            id="platform-chart"
            role="img"
            aria-label="Gráfico de barras: candidaturas enviadas, con respuesta, rechazadas y sin respuesta por plataforma"
          ></canvas>
        </div>
        <p class="chart-note" id="chart-note" hidden></p>
      </section>

      <section class="panel" aria-labelledby="applications-title">
        <h2 id="applications-title">Candidaturas</h2>

        <form class="filters" id="filters">
          <label>
            Plataforma
            <select id="filter-platform">
              <option value="">Todas</option>
            </select>
          </label>
          <label>
            Estado
            <select id="filter-status">
              <option value="">Todos</option>
              <option value="submitted">Enviada</option>
              <option value="viewed">Vista</option>
              <option value="rejected">Rechazada</option>
              <option value="closed">Cerrada</option>
            </select>
          </label>
          <label>
            Empresa
            <input id="filter-company" type="search" placeholder="Buscar empresa…" />
          </label>
        </form>

        <div class="table-wrap" id="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">Última novedad</th>
                <th scope="col">Plataforma</th>
                <th scope="col">Estado</th>
                <th scope="col">Empresa</th>
                <th scope="col">Puesto</th>
              </tr>
            </thead>
            <tbody id="applications"></tbody>
          </table>
        </div>
        <p class="empty" id="applications-empty" hidden>
          No hay candidaturas con estos filtros.
        </p>

        <nav class="pager" aria-label="Paginación">
          <button type="button" id="prev">« Anterior</button>
          <span id="page-info"></span>
          <button type="button" id="next">Siguiente »</button>
        </nav>
      </section>
    </main>

    <!-- Detalle de una candidatura: se abre al pulsar una fila de la tabla. -->
    <dialog id="detail" aria-labelledby="detail-company">
      <header class="detail-header">
        <div>
          <h2 id="detail-company"></h2>
          <p id="detail-position" class="detail-position"></p>
        </div>
        <button type="button" id="detail-close" aria-label="Cerrar">✕</button>
      </header>
      <p id="detail-meta" class="detail-meta"></p>
      <h3>Historial</h3>
      <ol id="detail-events" class="timeline"></ol>
    </dialog>
  </body>
</html>

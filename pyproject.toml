[project]
name = "canditrack"
version = "0.9.0"
description = "Seguimiento inteligente de candidaturas laborales conectado a Gmail"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0",
    "google-api-python-client>=2.202.0",
    "google-auth-oauthlib>=1.5.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
canditrack = "canditrack.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

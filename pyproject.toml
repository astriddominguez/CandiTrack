[project]
name = "canditrack"
version = "0.13.0"
description = "Seguimiento inteligente de candidaturas laborales conectado a Gmail"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0",
    "google-api-python-client>=2.202.0",
    "google-auth-oauthlib>=1.5.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
canditrack = "canditrack.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

# Las librerías de Google no publican anotaciones de tipos.
[[tool.mypy.overrides]]
module = ["google_auth_oauthlib.*", "googleapiclient.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["canditrack"]

[tool.coverage.report]
# La CI falla si la cobertura baja de aquí (hoy está en ~97 %; lo que falta es sobre todo
# el inicio de sesión de Gmail con navegador y arrancar el servidor).
fail_under = 95
show_missing = true
